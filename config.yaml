# Configuration de « quotidien ».
# Tous les seuils sont ici : on peut les modifier depuis l'appli GitHub de l'iPhone.
# Températures en °C, vent en km/h, pluie en mm, heures en heure de Paris.

position:
  # Le Raccourci iOS publie « lat,lon » sur le sujet ntfy privé ; on prend le dernier message
  # de moins de max_age_heures (ntfy.sh ne garde pas les messages plus de 12 h).
  max_age_heures: 12
  # Position utilisée quand le Raccourci iOS n'a rien publié récemment.
  defaut:
    nom: Lille
    lat: 50.6292
    lon: 3.0573

passages:
  matin:
    heure_envoi: "07:30"      # heure à laquelle la notification arrive (livraison différée ntfy)
    fenetre:                  # le script ne fait rien en dehors de cette plage (heure de Paris)
      debut: "05:00"
      fin: "09:30"            # après l'heure d'envoi mais avant la fin : envoi immédiat (retard du cron)
  soir:                       # alertes du soir (rules.yaml, « moment: soir »)
    heure_envoi: "19:00"
    fenetre:
      debut: "16:00"
      fin: "21:30"

journee:                      # heures prises en compte pour la pluie, le vent, l'air et les pollens
  debut: 7                    # de 7h…
  fin: 22                     # …à 22h (exclu)

pluie:
  seuil_mm: 0.2               # une heure est « pluvieuse » si la pluie prévue atteint ce cumul…
  seuil_probabilite: 60       # …ou si la probabilité de pluie atteint ce pourcentage
  fusion_trou_heures: 1       # deux créneaux séparés d'une heure sèche au plus sont regroupés
  creneaux_max: 3             # au-delà, on écrit « pluie par moments »

vent:
  rafales_affichees: 50       # les rafales sont indiquées à partir de cette vitesse

uv:
  affiche_a_partir_de: 3      # l'indice UV est indiqué à partir de cette valeur

air:
  # Indice européen de qualité de l'air (european_aqi) → mot affiché. Chaque niveau vaut jusqu'à « max » (exclu).
  niveaux:
    - { max: 20, mot: bon }
    - { max: 40, mot: moyen }
    - { max: 60, mot: dégradé }
    - { max: 80, mot: mauvais }
    - { max: 100, mot: très mauvais }
    - { max: 9999, mot: extrêmement mauvais }

pollens:
  # Un pollen n'est cité que si son maximum de la journée atteint ce seuil (grains/m³).
  # Hors saison les valeurs sont nulles : rien n'est affiché.
  seuils:
    aulne: 50
    bouleau: 50
    graminees: 30
    armoise: 30
    olivier: 50
    ambroisie: 20

feries:
  horizon_jours: 60           # le prochain jour férié n'est cité que s'il tombe dans ce délai

conseil:
  # Un seul conseil par jour, le premier de cette liste dont la condition est remplie. Aucun sinon.
  priorite: [air_mauvais, vent_fort, gel, parapluie, manteau, creme_solaire]
  air_mauvais:
    indice: 80                # indice européen maximal de la journée
  vent_fort:
    rafales: 70               # rafales maximales de la journée
  gel:
    temperature: 0            # température minimale entre « heures »…
    heures: [5, 10]           # …de 5h à 10h (exclu), le moment où l'on part
  parapluie:
    cumul_mm: 1               # cumul de pluie sur la journée…
    probabilite: 70           # …ou probabilité maximale sur la journée
  manteau:
    ressenti: 3               # ressenti minimal entre « heures »
    heures: [7, 10]
  creme_solaire:
    uv: 6                     # indice UV maximal de la journée

notification:
  verset: false               # le verset et le hadith sont sur la page, pas dans la notification
  priorite: 3                 # priorité ntfy (1 = min, 3 = normale, 5 = max)
  lien: ""                    # adresse de la page de détail (ajoutée quand la page existera)

agenda:
  # Liens ICS : secret GitHub CALENDAR_URLS, une ligne « libellé|url_ics » par agenda.
  # Les événements ne vont que dans la notification (jamais sur la page, dans un log ou un fichier).
  detail: titres              # titres (« 14h Dentiste ») | nombre (« Agenda : 2 aujourd'hui, 1 demain matin »)
  lignes_max: 3               # lignes d'agenda au plus (les anniversaires ne comptent pas)
  demain_matin_jusqua: "12:00" # après aujourd'hui, on montre demain jusqu'à cette heure
  longueur_titre: 40          # titres plus longs coupés par « … »
  # Filtre « hors travail » :
  ignorer_agendas: []         # libellés d'agendas entiers à ignorer, ex. [Travail]
  ignorer_mots_cles:          # événements dont le titre contient un de ces mots (sans tenir compte des accents ni des majuscules)
    - réunion
    - teams
    - visio
    - point hebdo
    - comité
    - sprint
    - standup
    - meeting
  anniversaires:
    actif: true               # false : les anniversaires ne sont pas affichés
    # Agendas dont tous les événements « toute la journée » sont des anniversaires
    # (en plus des événements dont le titre contient « anniversaire »).
    agendas: [Anniversaires, Birthdays]

state:
  purge_jours: 14             # les entrées de state/state.json plus vieilles sont supprimées
