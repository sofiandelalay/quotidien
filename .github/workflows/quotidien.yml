name: quotidien

on:
  schedule:
    # Le cron GitHub est en UTC et souvent en retard. Deux déclenchements par passage,
    # à une heure d'écart, pour couvrir l'heure d'hiver (UTC+1) et l'heure d'été (UTC+2).
    # Minutes décalées (:23) pour éviter les heures pleines, très chargées chez GitHub.
    # Matin (briefing 7h30 + règles du matin) :
    #   04:23 UTC = 05:23 à Paris en hiver, 06:23 en été
    #   05:23 UTC = 06:23 à Paris en hiver, 07:23 en été
    - cron: "23 4 * * *"
    - cron: "23 5 * * *"
    # Soir (règles du soir, 19h00) :
    #   15:23 UTC = 16:23 à Paris en hiver, 17:23 en été
    #   16:23 UTC = 17:23 à Paris en hiver, 18:23 en été
    - cron: "23 15 * * *"
    - cron: "23 16 * * *"
    # Le script choisit le passage d'après l'heure de Paris (fenêtres dans config.yaml), ne refait
    # jamais un passage déjà fait et programme les notifications chez ntfy (champ « delay »).
  workflow_dispatch:
    inputs:
      passage:
        description: "Passage à lancer"
        type: choice
        options: [matin, soir]
        default: matin
      force:
        description: "Maintenant, hors fenêtre (le briefing forcé est un test ; une alerte n'est jamais envoyée deux fois)"
        type: boolean
        default: false
      essai:
        description: "Alerte d'essai : envoie la notification d'une règle sur données fictives (rien n'est noté dans state.json)"
        type: choice
        options: [aucune, rando, voiture, air, gel]
        default: aucune

permissions:
  contents: write   # commit de state.json
  pages: write      # déploiement de la page de détail
  id-token: write   # exigé par actions/deploy-pages

# Jamais deux exécutions en parallèle : la seconde attend et relit state.json à jour.
concurrency:
  group: quotidien
  cancel-in-progress: false

jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      site: ${{ steps.site.outputs.pret }}
    steps:
      - name: Masquer les secrets
        env:
          NTFY_TOPIC_BRIEFING: ${{ secrets.NTFY_TOPIC_BRIEFING }}
          NTFY_TOPIC_POSITION: ${{ secrets.NTFY_TOPIC_POSITION }}
          CALENDAR_URLS: ${{ secrets.CALENDAR_URLS }}
        run: |
          echo "::add-mask::$NTFY_TOPIC_BRIEFING"
          echo "::add-mask::$NTFY_TOPIC_POSITION"
          # chaque lien ICS, entier et sans son libellé
          printf '%s\n' "$CALENDAR_URLS" | while IFS= read -r ligne; do
            ligne="${ligne%$'\r'}"
            [ -n "$ligne" ] || continue
            echo "::add-mask::$ligne"
            url="${ligne#*|}"
            echo "::add-mask::$url"
          done

      # ref: main (et non le commit du déclenchement) pour lire le state.json le plus récent,
      # même si une exécution précédente l'a commité pendant que celle-ci attendait.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Vérifier le registre npm
        run: node scripts/check-lock.mjs

      - run: npm ci --no-audit --no-fund

      - name: Passage du matin ou du soir
        env:
          NTFY_TOPIC_BRIEFING: ${{ secrets.NTFY_TOPIC_BRIEFING }}
          NTFY_TOPIC_POSITION: ${{ secrets.NTFY_TOPIC_POSITION }}
          CALENDAR_URLS: ${{ secrets.CALENDAR_URLS }}
          # schedule : « auto » (d'après l'heure) ; manuel : le passage choisi
          PASSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.passage || 'auto' }}
          FORCE: ${{ inputs.force == true }}
          ESSAI: ${{ inputs.essai != 'aucune' && inputs.essai || '' }}
        run: node src/main.mjs --site _site

      # Page de détail : assemblée dans _site/ (jamais commité) quand un passage a eu lieu,
      # puis publiée comme artefact Pages. Rien n'est déployé si le passage était déjà fait.
      - name: Assembler la page
        id: site
        if: always()
        run: |
          if [ -f _site/data.json ]; then
            node scripts/site.mjs _site
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          else
            echo "Pas de nouvelles données : la page en ligne reste telle quelle."
          fi

      - name: Publier l'artefact de la page
        if: always() && steps.site.outputs.pret == 'oui'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # Commit de state.json (même après un échec partiel : ce qui est parti ne repartira pas).
      # Le commit quotidien garde aussi le cron actif (GitHub suspend les crons d'un dépôt
      # sans activité pendant 60 jours).
      - name: Commiter state.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          if git diff --cached --quiet; then echo "state.json inchangé"; exit 0; fi
          git commit -m "État du $(TZ=Europe/Paris date +%F)"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          exit 1

  page:
    needs: passage
    if: always() && needs.passage.outputs.site == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Déployer la page de détail
        id: deploiement
        uses: actions/deploy-pages@v4

